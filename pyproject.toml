[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-platform"
version = "0.1.0"
description = "Skills, subagentes, hooks e servidor MCP para levar uma demanda do card ao merge com prova real."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amon Melo" }]
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-mcp = "agentic_platform.mcp_server:main"
agentic-aprovar = "agentic_platform.aprovar:main"
agentic-metricas = "agentic_platform.metricas:main"
agentic-recibo = "agentic_platform.recibo:main"
agentic-instalar = "agentic_platform.instalar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_platform = ["claude/*.json", "claude/agents/*.md", "claude/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
